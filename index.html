<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>CSS vs. JS</title>
</head>
<body>
    <header>
        <h1>Trocar imagem ao passar o mouse!</h1>
    </header>
    <section>
        <figure id="charizard1">
            <img src="img/charizard chiny.jpg" alt="charizard shiny" 
            onmouseover="this.src='./img/images.jpg'"
            onmouseout="this.src='./img/charizard chiny.jpg'">
            <figcaption>usando mouseover/mouseout</figcaption>
        </figure>

         <figure id="charizard2">
            <img>
            <figcaption>usando mouseover/mouseout</figcaption>
        </figure>
    </section>
</body>
</html>
